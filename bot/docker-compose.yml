# Running on the VPS at /opt/val-price-bot (ssh vps).
#
#   cd bot
#   cp .env.example .env     then fill secrets in .env
#   docker compose up -d --build
#   docker compose logs -f
#
# Container restarts when Docker/PC restarts (restart: unless-stopped).
# The bot runs one round AT STARTUP, then daily at RUN_AT_HOUR.

services:
  val-price-bot:
    build: .
    image: 0xhieu-val-price-bot
    container_name: val-price-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    # No mounted volume: the bot keeps no state, everything is in Cloudflare KV.
